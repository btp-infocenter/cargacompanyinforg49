_schema-version: "3.2"
ID: cargacompanyinforg49
description: Carga Datos Cabecera - Fiori Elements App
version: 0.0.1
modules:
- name: cargacompanyinforg49-destination-content
  type: com.sap.application.content
  requires:
  - name: cargacompanyinforg49-destination-service
    parameters:
      content-target: true
  - name: cargacompanyinforg49-repo-host
    parameters:
      service-key:
        name: cargacompanyinforg49-repo-host-key
  - name: cargacompanyinforg49-uaa
    parameters:
      service-key:
        name: cargacompanyinforg49-uaa-key
  parameters:
    content:
      instance:
        destinations:
        - Name: cargacompanyinforg49_html_repo_host
          ServiceInstanceName: cargacompanyinforg49-html5-service
          ServiceKeyName: cargacompanyinforg49-repo-host-key
          sap.cloud.service: cargacompanyinforg49
        - Authentication: OAuth2UserTokenExchange
          Name: cargacompanyinforg49_uaa
          ServiceInstanceName: cargacompanyinforg49-xsuaa-service
          ServiceKeyName: cargacompanyinforg49-uaa-key
          sap.cloud.service: cargacompanyinforg49
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: cargacompanyinforg49-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: cargacompanyinforg49-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - cargacompanyinforg49.zip
      name: cargacompanyinforg49
      target-path: resources/
- name: cargacompanyinforg49
  type: html5
  path: .
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: cargacompanyinforg49-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    service: destination
    service-name: cargacompanyinforg49-destination-service
    service-plan: lite
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
- name: cargacompanyinforg49-uaa
  type: org.cloudfoundry.managed-service
  parameters:
    service: xsuaa
    service-name: cargacompanyinforg49-xsuaa-service
    service-plan: application
    path: ./xs-security.json
- name: cargacompanyinforg49-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: cargacompanyinforg49-html5-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true